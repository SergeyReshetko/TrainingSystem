spring:
  application:
    name: trainingSystem
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false
  logging:
    level:
    liquibase: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.jdbc: DEBUG
  server:
    port: 8080
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: custom
    tags-sorter: order
    try-it-out-enabled: true
    filter: true
    display-request-duration: true  # Показывать время выполнения запроса
    doc-expansion: list  # Как отображать endpoints: 'list', 'full', 'none'
    default-models-expand-depth: 1  # Глубина разворачивания моделей
    default-model-expand-depth: 1
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json  # Тип запросов по умолчанию
  paths-to-match: /api/v1/**  # Какие пути включать в документацию
  packages-to-scan: com.trainingsystem.controller